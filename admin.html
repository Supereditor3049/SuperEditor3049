<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Live Payments</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --bg: #050505; --card: #0d0d0d; --accent: #00ffa3; 
            --border: #1a1a1a; --danger: #ff4d4d; --warning: #ffbb00;
            --text: #ffffff; --text-dim: #888888;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: none; /* Esconde até logar */ }
        
        header { padding: 1.2rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .controls { display: flex; gap: 10px; align-items: center; }
        
        .notif-btn { background: var(--card); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s; color: white; font-size: 0.8rem; }
        .notif-btn.active { border-color: var(--accent); color: var(--accent); }
        .notif-btn.pulse { border-color: var(--danger); animation: pulse-anim 1.8s infinite; color: var(--danger); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 10px; border-radius: 12px; cursor: pointer; }
        .logout-btn:hover { color: var(--danger); border-color: var(--danger); }

        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
        .search-wrap { margin-bottom: 1rem; display: flex; justify-content: flex-start; }
        .search-box { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: white; font-size: 0.75rem; width: 180px; outline: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 20px; border-left: 4px solid var(--accent); }
        .card b { font-size: 1.8rem; display: block; margin-top: 8px; color: var(--accent); }

        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { padding: 1.2rem; background: rgba(255,255,255,0.02); color: var(--text-dim); text-align: left; font-size: 0.8rem; }
        td { padding: 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }
        .badge.approved { background: rgba(0, 255, 163, 0.1); color: var(--accent); }
        .badge.pending { background: rgba(255, 187, 0, 0.1); color: var(--warning); }

        /* Estilo do Login */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg); }
        .login-box { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: #000; color: white; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" style="display:none;">
        <div class="login-box">
            <i data-lucide="lock" style="color:var(--accent); margin-bottom: 1rem;"></i>
            <h2>Área Restrita</h2>
            <input type="email" id="logEmail" placeholder="E-mail">
            <input type="password" id="logPass" placeholder="Senha">
            <button onclick="fazerLogin()">Entrar no Painel</button>
            <p id="loginError" style="color:var(--danger); font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="admin-content" style="display:none;">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <i data-lucide="layout-dashboard" style="color: var(--accent)"></i>
                <h1 style="margin:0; font-size: 1.1rem;">LIVE ADMIN</h1>
            </div>
            <div class="controls">
                <div class="notif-btn pulse" id="btn-audio" onclick="toggleAudio()">
                    <i id="audio-icon" data-lucide="volume-x"></i>
                    <span id="audio-txt">LIGAR ÁUDIO</span>
                </div>
                <button class="logout-btn" onclick="fazerLogout()" title="Sair">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="search-wrap">
                <input type="text" id="searchInput" class="search-box" placeholder="Buscar e-mail..." oninput="handleSearch()">
            </div>
            <div class="grid">
                <div class="card"><span>Faturamento Total</span><b id="stat-rev">R$ 0,00</b></div>
                <div class="card"><span>Vendas Aprovadas</span><b id="stat-ok">0</b></div>
                <div class="card"><span>Aguardando Pix</span><b id="stat-wait">0</b></div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th style="width: 50px;">#</th><th>E-mail do Cliente</th><th>Status</th><th>Data</th><th>Valor</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        const SUPABASE_URL = "https://mtuccfhpspgmpoehxmmr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10dWNjZmhwc3BnbXBvZWh4bW1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMjM0MTMsImV4cCI6MjA4NDY5OTQxM30.X2K0tSteG0gPLTj3a_h8GEvzyE-X4uI9OJhgHrwC7n8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const sound = new Audio('audio.wav');
        let isLive = false;
        let allOrders = [];
        const itemsPerPage = 50;

        // --- LÓGICA DE SEGURANÇA ---
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            
            // Só deixa entrar se for o seu e-mail específico
            if (session && session.user.email === 'supereditor3049@gmail.com') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                document.body.style.display = 'block';
                initDashboard();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('admin-content').style.display = 'none';
                document.body.style.display = 'block';
                lucide.createIcons();
            }
        }

        window.fazerLogin = async () => {
            const email = document.getElementById('logEmail').value;
            const password = document.getElementById('logPass').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('loginError').innerText = "Acesso negado.";
            } else {
                location.reload();
            }
        };

        window.fazerLogout = async () => {
            await supabase.auth.signOut();
            location.reload();
        };

        // --- LÓGICA DO DASHBOARD ---
        async function initDashboard() {
            syncData();
            runRealtime();
            lucide.createIcons();
        }

        async function syncData() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: true });
            if (!data) return;
            allOrders = data;
            handleSearch();
        }

        window.handleSearch = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allOrders.filter(o => o.email.toLowerCase().includes(term));
            
            const paid = allOrders.filter(o => o.status === 'approved');
            document.getElementById('stat-rev').innerText = (paid.length * 12.9).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('stat-ok').innerText = paid.length;
            document.getElementById('stat-wait').innerText = allOrders.length - paid.length;
            
            const displayData = [...filtered].reverse();
            document.getElementById('tableBody').innerHTML = displayData.slice(0, itemsPerPage).map((o) => {
                const globalIndex = allOrders.findIndex(item => item.id === o.id) + 1;
                return `<tr>
                    <td style="color:var(--text-dim)">${globalIndex}</td>
                    <td>${o.email}</td>
                    <td><span class="badge ${o.status}">${o.status === 'approved' ? 'PAGO' : 'PENDENTE'}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString('pt-BR')}</td>
                    <td style="color:var(--accent)">R$ 12,90</td>
                </tr>`
            }).join('');
        };

        window.toggleAudio = async () => {
            isLive = !isLive;
            const btn = document.getElementById('btn-audio'), icon = document.getElementById('audio-icon'), txt = document.getElementById('audio-txt');
            btn.className = isLive ? 'notif-btn active' : 'notif-btn pulse';
            icon.setAttribute('data-lucide', isLive ? 'volume-2' : 'volume-x');
            txt.innerText = isLive ? "ÁUDIO ATIVO" : "LIGAR ÁUDIO";
            lucide.createIcons();
        };

        function runRealtime() {
            supabase.channel('sales').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (p) => {
                syncData();
                if (isLive && p.new && p.new.status === 'approved' && (!p.old || p.old.status !== 'approved')) {
                    sound.play().catch(()=>{});
                }
            }).subscribe();
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
