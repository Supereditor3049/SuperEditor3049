<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel God Mode | LuxoRifa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #eee; font-family: sans-serif; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; padding: 24px; }
        input { background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px; color: white; width: 100%; }
        label { font-size: 12px; color: #666; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-black italic">GOD <span class="text-yellow-500">MODE</span></h1>
                <p class="text-gray-500 text-xs text-uppercase tracking-widest">Controle de Percepção da Rifa</p>
            </div>
            <button onclick="saveSettings()" class="bg-yellow-500 text-black px-6 py-2 rounded-lg font-bold text-sm hover:bg-yellow-400 transition-all">
                Salvar Alterações
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card border-yellow-500/20">
                <h3 class="text-yellow-500 font-bold mb-6 flex items-center gap-2">
                    <span>👁️</span> Vitrine (O que o cliente vê)
                </h3>
                
                <div class="mb-6">
                    <label>Progresso Fake da Barra (%)</label>
                    <input type="range" id="fakeProgress" min="0" max="99" class="accent-yellow-500">
                    <div class="flex justify-between mt-2 text-xs font-mono">
                        <span id="progValue">0%</span>
                        <span class="text-red-500">Zona de Urgência</span>
                    </div>
                </div>

                <div class="mb-6">
                    <label>Preço Exibido por Cota (R$)</label>
                    <input type="number" id="ticketPrice" step="0.01" value="0.60">
                </div>
            </div>

            <div class="card">
                <h3 class="text-blue-500 font-bold mb-6 flex items-center gap-2">
                    <span>📊</span> Realidade (Privado)
                </h3>
                <div class="space-y-4">
                    <div class="p-4 bg-black/50 rounded-lg border border-white/5">
                        <p class="text-[10px] text-gray-500">Faturamento Bruto</p>
                        <p class="text-2xl font-mono text-green-500">R$ 14.590,20</p>
                    </div>
                    <div class="p-4 bg-black/50 rounded-lg border border-white/5">
                        <p class="text-[10px] text-gray-500">Vendas Reais</p>
                        <p class="text-2xl font-mono">24.317 <span class="text-xs text-gray-600">cotas</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-6">
            <h3 class="text-gray-400 font-bold mb-4 text-xs uppercase tracking-widest">Últimas Atividades (Alfanumérico)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="text-gray-600 border-b border-white/5">
                        <tr>
                            <th class="pb-3">Data</th>
                            <th class="pb-3">Cliente</th>
                            <th class="pb-3">Qtd</th>
                            <th class="pb-3">Código Gerado</th>
                            <th class="pb-3">Status</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-400">
                        <tr class="border-b border-white/5">
                            <td class="py-3">26/01/26</td>
                            <td class="text-white">Marcos S.</td>
                            <td>100</td>
                            <td class="font-mono text-yellow-500">A1Z90...A1Z99</td>
                            <td><span class="text-green-500 text-[10px] bg-green-500/10 px-2 py-0.5 rounded">Pago</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Sincroniza o slider com o texto
        const slider = document.getElementById('fakeProgress');
        const progValue = document.getElementById('progValue');
        slider.oninput = function() { progValue.innerHTML = this.value + '%'; }

        function saveSettings() {
            const settings = {
                progress: slider.value,
                price: document.getElementById('ticketPrice').value
            };
            localStorage.setItem('raffleSettings', JSON.stringify(settings));
            alert('Configurações salvas no navegador! Em um sistema real, aqui dispararíamos uma atualização para o GitHub/Banco.');
        }
    </script>
</body>
</html>
