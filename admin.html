<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Live Payments</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #0d0d0d; --accent: #00ffa3; --border: #1a1a1a; --text: #ffffff; --text-dim: #888888; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        header { padding: 1.2rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100; }
        .notif-btn { background: var(--card); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; cursor: pointer; color: white; display: flex; align-items: center; gap: 10px; }
        main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
        .search-box { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: white; font-size: 0.75rem; width: 180px; outline: none; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 20px; border-left: 4px solid var(--accent); }
        .card b { font-size: 1.8rem; display: block; margin-top: 8px; color: var(--accent); }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 1.2rem; background: rgba(255,255,255,0.02); color: var(--text-dim); text-align: left; font-size: 0.8rem; }
        td { padding: 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }
        .badge.approved { background: rgba(0, 255, 163, 0.1); color: var(--accent); }
        .badge.pending { background: rgba(255, 187, 0, 0.1); color: #ffbb00; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 2rem; padding-bottom: 2rem; }
        .page-btn { background: var(--card); border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .page-btn:disabled { opacity: 0.3; }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 12px;"><i data-lucide="layout-dashboard" style="color: var(--accent)"></i><h1 style="margin:0; font-size: 1.1rem;">LIVE ADMIN</h1></div>
        <button class="notif-btn" id="btn-audio" onclick="toggleAudio()">LIGAR ÁUDIO</button>
    </header>
    <main>
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar e-mail..." onkeyup="handleSearch()">
        <div class="grid">
            <div class="card"><span>Faturamento</span><b id="stat-rev">R$ 0,00</b></div>
            <div class="card"><span>Aprovadas</span><b id="stat-ok">0</b></div>
            <div class="card"><span>Pendentes</span><b id="stat-wait">0</b></div>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th style="width: 60px;"># ID</th><th>Cliente</th><th>Status</th><th>Data</th><th>Valor</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pagination">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Anterior</button>
            <span id="page-info"></span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Próxima</button>
        </div>
    </main>

    <script type="module">
        const SUPABASE_URL = "https://mtuccfhpspgmpoehxmmr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10dWNjZmhwc3BnbXBvZWh4bW1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMjM0MTMsImV4cCI6MjA4NDY5OTQxM30.X2K0tSteG0gPLTj3a_h8GEvzyE-X4uI9OJhgHrwC7n8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const sound = new Audio('audio.wav');
        let isLive = false, allOrders = [], filteredOrders = [], currentPage = 1, itemsPerPage = 50;

        async function syncData() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: true });
            if (data) { allOrders = data; handleSearch(); }
        }

        window.handleSearch = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredOrders = allOrders.filter(o => o.email.toLowerCase().includes(term));
            
            const paid = allOrders.filter(o => o.status === 'approved');
            document.getElementById('stat-rev').innerText = (paid.length * 12.9).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('stat-ok').innerText = paid.length;
            document.getElementById('stat-wait').innerText = allOrders.length - paid.length;
            
            currentPage = 1; 
            renderTable();
        };

        function renderTable() {
            // Inverte para os novos aparecerem primeiro, mas o cálculo de ID se mantém global
            const displayData = [...filteredOrders].reverse();
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = displayData.slice(start, start + itemsPerPage);

            document.getElementById('tableBody').innerHTML = pageData.map((o) => {
                // Inteligência de numeração: O ID é a posição real dele no banco de dados (allOrders)
                const realId = allOrders.findIndex(item => item.id === o.id) + 1;
                return `<tr>
                    <td style="color:var(--text-dim); font-weight:bold;">#${realId}</td>
                    <td>${o.email}</td>
                    <td><span class="badge ${o.status}">${o.status === 'approved' ? 'PAGO' : 'PENDENTE'}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString('pt-BR')}</td>
                    <td style="color:var(--accent)">R$ 12,90</td>
                </tr>`;
            }).join('');

            const totalPages = Math.ceil(filteredOrders.length / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        window.changePage = (dir) => { currentPage += dir; renderTable(); };
        window.toggleAudio = () => { isLive = !isLive; document.getElementById('btn-audio').innerText = isLive ? 'ÁUDIO ATIVO' : 'LIGAR ÁUDIO'; };

        function runRealtime() {
            supabase.channel('sales').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (p) => {
                syncData();
                if (isLive && p.new && p.new.status === 'approved' && (!p.old || p.old.status !== 'approved')) {
                    sound.currentTime = 0; sound.play().catch(()=>{});
                }
            }).subscribe();
        }

        window.onload = () => { syncData(); runRealtime(); lucide.createIcons(); };
    </script>
</body>
</html>
