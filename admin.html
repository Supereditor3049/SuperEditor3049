<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gold | Live</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #050505; --card: #0d0d0d; --accent: #00ffa3; --border: #1a1a1a; --danger: #ff4d4d; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: var(--card); border: 1px solid var(--border); padding: 2rem; border-radius: 20px; text-align: center; width: 320px; }
        .login-box input { width: 100%; background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; margin: 8px 0; outline: none; box-sizing: border-box; }
        .login-box button { width: 100%; background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 10px; cursor: pointer; }
        header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #000; position: sticky; top: 0; z-index: 10; }
        .notif-btn { background: var(--card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; outline: none; }
        .notif-btn.active { border-color: var(--accent); color: var(--accent); }
        .notif-btn.pulse { border-color: var(--danger); animation: pulse 1.5s infinite; color: var(--danger); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        main { padding: 2rem; max-width: 1000px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 15px; border-left: 3px solid var(--accent); }
        .card b { font-size: 1.8rem; display: block; margin-top: 5px; color: var(--accent); }
        .table-box { background: var(--card); border: 1px solid var(--border); border-radius: 15px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: bold; }
        .badge.approved { background: rgba(0, 255, 163, 0.1); color: var(--accent); }
        .badge.pending { background: rgba(255, 187, 0, 0.1); color: #ffbb00; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h3>Painel de Vendas</h3>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Senha">
            <button onclick="handleLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="admin-content" style="display:none">
        <header>
            <div style="font-weight:bold;">LIVE MONITOR</div>
            <div class="notif-btn pulse" id="btn" onclick="toggle()">
                <i id="icon" data-lucide="volume-x"></i>
                <span id="txt">ÁUDIO OFF</span>
            </div>
        </header>
        <main>
            <div class="grid">
                <div class="card"><span>Faturamento</span><b id="stat-rev">R$ 0,00</b></div>
                <div class="card"><span>Pagos</span><b id="stat-ok">0</b></div>
                <div class="card"><span>Pendentes</span><b id="stat-wait">0</b></div>
            </div>
            <div class="table-box">
                <table>
                    <thead><tr><th>CLIENTE</th><th>STATUS</th><th>DATA</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        const SUPABASE_URL = "https://mtuccfhpspgmpoehxmmr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10dWNjZmhwc3BnbXBvZWh4bW1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMjM0MTMsImV4cCI6MjA4NDY5OTQxM30.X2K0tSteG0gPLTj3a_h8GEvzyE-X4uI9OJhgHrwC7n8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // --- CORREÇÃO DE ÁUDIO ---
        const sound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
        sound.preload = 'auto';
        let isLive = false;

        window.toggle = async () => {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                isLive = !isLive;
                if(isLive) {
                    // Toca e pausa rápido para "desbloquear" o canal de áudio no navegador
                    sound.play().then(() => { sound.pause(); sound.currentTime = 0; }).catch(e => console.log(e));
                }
                updateUI();
            } else {
                alert("Ative as notificações no cadeado da URL!");
            }
        };

        function updateUI() {
            const b = document.getElementById('btn'), i = document.getElementById('icon'), t = document.getElementById('txt');
            if (isLive) {
                b.className = 'notif-btn active'; i.setAttribute('data-lucide', 'volume-2'); t.innerText = "ÁUDIO ON";
            } else {
                b.className = 'notif-btn pulse'; i.setAttribute('data-lucide', 'volume-x'); t.innerText = "ÁUDIO OFF";
            }
            lucide.createIcons();
        }

        async function sync() {
            const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            if (!data) return;
            const paid = data.filter(o => o.status === 'approved');
            document.getElementById('stat-rev').innerText = (paid.length * 12.9).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('stat-ok').innerText = paid.length;
            document.getElementById('stat-wait').innerText = data.length - paid.length;
            document.getElementById('tableBody').innerHTML = data.map(o => `
                <tr><td>${o.email}</td><td><span class="badge ${o.status}">${o.status === 'approved' ? 'PAGO' : 'PENDENTE'}</span></td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>
            `).join('');
        }

        function runRealtime() {
            supabase.channel('sales').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (p) => {
                sync();
                if (isLive) {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log("Erro som:", e));
                    new Notification(p.eventType === 'INSERT' ? "Nova Ordem" : "Venda Aprovada!", { body: p.new.email });
                }
            }).subscribe();
        }

        window.handleLogin = async () => {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value, password: document.getElementById('password').value
            });
            if (!error) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                sync(); runRealtime(); lucide.createIcons();
            }
        };

        window.addEventListener('load', async () => {
            lucide.createIcons();
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                sync(); runRealtime();
            }
        });
    </script>
</body>
</html>
