<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LuxoRifa | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/animations.css">
    <style>
        /* CSS Profissional: Variáveis e Design System */
        :root { --gold: #d4af37; --dark: #050505; }
        body { background: var(--dark); color: white; overflow-x: hidden; }
        .gold-border { border: 1px solid rgba(212, 175, 55, 0.3); }
        .blur-bg { backdrop-filter: blur(12px); background: rgba(0,0,0,0.7); }
    </style>
</head>
<body>
    <div id="app">
        <nav class="fixed top-0 w-full z-50 blur-bg gold-border py-4 px-8 flex justify-between">
            <div class="font-black italic text-2xl tracking-tighter">LUXO<span class="text-[var(--gold)]">RIFA</span></div>
            <div id="user-menu" class="flex gap-4 items-center">
                <span class="text-xs text-gray-500 font-bold uppercase tracking-widest">Sorteio Federal</span>
                <div class="w-8 h-8 rounded-full bg-[var(--gold)]"></div>
            </div>
        </nav>

        <header class="pt-40 pb-20 text-center relative">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-96 bg-yellow-500/5 blur-[120px]"></div>
            <h1 class="text-6xl font-black italic uppercase mb-4 tracking-tight">Vença o Impossível</h1>
            <p id="raffle-title" class="text-gray-400 text-xl uppercase tracking-[0.3em]">Porsche 911 GT3</p>
        </header>

        <main class="max-w-4xl mx-auto px-6" id="raffle-container">
            </main>
    </div>

    <script src="assets/js/raffle-engine.js"></script>
    <script src="assets/js/ui-controller.js"></script>
</body>
</html>
